# AST export: unit tests, and the real-IG measurements that cannot run in an
# environment without access to packages.fhir.org / tx.fhir.org.
#
# Added by ast-export (a library on top of the Publisher); it builds and runs
# only ast-export/ and touches no other workflow or module.
name: ast-export

on:
  push:
    branches: [claude/ast-export]
    paths:
      - "ast-export/**"
      - ".github/workflows/ast-export.yml"
  workflow_dispatch:
    inputs:
      byte_identical:
        description: "Also build smart-trust with the stock Publisher and diff output/"
        type: boolean
        default: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - run: mvn -q -B test
        working-directory: ast-export

  real-igs:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: "3.3" }
      - name: Tools
        run: |
          npm i -g fsh-sushi
          gem install --no-document jekyll
          sushi --version; jekyll --version; java -version
      - name: W1 + W2 on smart-trust and smart-immunizations
        run: |
          flag=""
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.byte_identical }}" = "true" ]; then flag="--byte-identical"; fi
          ast-export/run-real-igs.sh "$RUNNER_TEMP/igs" $flag | tee "$RUNNER_TEMP/summary.txt"
          { echo '```'; cat "$RUNNER_TEMP/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: W7 — one incremental round on a one-file change (never run before; allowed to fail)
        continue-on-error: true
        run: ast-export/ci/w7-round.sh "$RUNNER_TEMP/igs" | tee "$RUNNER_TEMP/w7.txt"
      - name: W7 summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/w7.txt" ] && { echo '### W7'; echo '```'; tail -60 "$RUNNER_TEMP/w7.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ast-export-real-igs
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/summary.txt
            ${{ runner.temp }}/w7.txt
            ${{ runner.temp }}/igs/*.log
            ${{ runner.temp }}/igs/*/output-ast/
            ${{ runner.temp }}/igs/w7/
